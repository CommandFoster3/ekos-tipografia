<style>

  :root { --ui: #F2F2F2; --ink: #000000; --muted: #787878; --line: #C4C4C4;

  body { display: flex; flex-direction: column; min-height: 420px; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  .escena { position: relative; flex: 1; overflow: hidden; touch-action: pan-y; }
  .escena svg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0;

  .escena svg.on { opacity: 1; }
  .escena g.fig { transform-box: view-box; transition: transform 1.8s var(--ease); }
  .escena:hover svg.on g.fig { transform: rotate(4deg) scale(1.03); }   /* en hover se mueve un poco */

  .barra { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 28px;
           padding: 18px 28px; font-size: 14px; }
  .titulo { white-space: nowrap; } .titulo b { font-weight: 700; } .titulo span { color: var(--muted); margin-left: 10px; }
  .puntos { display: flex; gap: 6px; justify-content: center; }
  .puntos button { width: 22px; height: 18px; position: relative; }
  .puntos button::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--line);
                          transition: background .3s, height .3s; }
  .puntos button[aria-current="true"]::after { background: var(--ink); height: 2px; }
  .puntos button:hover::after { background: var(--muted); }
  .color { display: flex; gap: 16px; color: var(--muted); white-space: nowrap; }
  .color i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
  .color em { font-style: normal; color: var(--ink); }
  .flechas { display: flex; gap: 4px; }
  .flechas button { padding: 4px 8px; font-size: 18px; color: var(--muted); transition: color .3s; }
  .flechas button:hover { color: var(--ink); }

  @media (max-width: 900px) {
    .barra { grid-template-columns: 1fr auto; gap: 12px 20px; padding: 14px 16px; }
    .puntos { display: none; }
    .color { grid-column: 1 / -1; order: 3; flex-wrap: wrap; gap: 6px 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .escena svg, .escena g.fig { transition: none; }
    .escena:hover svg.on g.fig { transform: none; }
  }
</style>
