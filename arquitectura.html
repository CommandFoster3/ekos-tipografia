<title>Ekos · Arquitectura de marca</title>
<!-- EKOS · Arquitectura de marca interactiva. Altura recomendada del iframe: 760 px -->
<style>
  @font-face { font-family: "Areal"; src: url("fonts/Areal-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Areal"; src: url("fonts/Areal-Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }
  :root { --bg: #000000; --ink: #F2F2F2; --muted: #787878; --line: #333333; --ease: cubic-bezier(.2,.7,.2,1);
          --sans: "Areal", "ABC Areal", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  body { display: flex; flex-direction: column; min-height: 420px; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  .escena { position: relative; flex: 1; min-height: 0; }
  #arq { position: absolute; inset: 0; width: 100%; height: 100%; }

  #arq .velo { fill: #000; opacity: 0; transition: opacity .6s var(--ease); pointer-events: none; }
  #arq .velo.on { opacity: .82; }
  #arq .velo.suave { opacity: .55; }
  #arq .zona { fill: transparent; cursor: pointer; }

  .barra { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 10px 32px; padding: 16px 28px 18px;
           border-top: 1px solid var(--line); font-size: 14px; }
  .barra b { font-weight: 700; white-space: nowrap; }
  .filtros { display: flex; flex-wrap: wrap; gap: 6px 22px; }
  .filtros button { padding: 3px 0; color: var(--muted); border-bottom: 1px solid transparent; transition: color .3s, border-color .3s; }
  .filtros button:hover { color: var(--ink); }
  .filtros button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  .info { grid-column: 1 / -1; color: var(--muted); line-height: 1.45; min-height: 2.9em; }
  .info em { font-style: normal; color: var(--ink); }
  @media (max-width: 700px) { .barra { grid-template-columns: 1fr; padding: 14px 16px; } }
</style>

    digitalnet:     { n: "Digital", r: [1225, 655, 1320, 940], col: [1225, 655, 1313, 1080], t: "AI Business Summit · MKT Digital" },
    negocios:       { n: "Negocios", r: [1313, 655, 1420, 945], col: [1313, 655, 1402, 1080], t: "1000 Awards · Cumbre de Cooperativas" },
    talento:        { n: "Talento y cultura organizacional", r: [1395, 655, 1500, 905], col: [1402, 655, 1492, 1080], t: "The Future of Work (con Great Place to Work)" },
    wellness:       { n: "Wellness", r: [1490, 655, 1590, 905], col: [1492, 655, 1600, 1080], t: "Ekos Wellness" }
  };
  var NS = "http://www.w3.org/2000/svg", svg = document.getElementById("arq"),
      filtros = document.getElementById("filtros"), info = document.getElementById("info");
  var vb = [0, 0, 1920, 1080], anim = null, actual = "todo", sub = null;

  function el(tag, at) { var e = document.createElementNS(NS, tag); for (var k in at) e.setAttribute(k, at[k]); return e; }
  var capa = el("g", {}); svg.appendChild(capa);
  var velos = {}, velosSub = {};
  ["print", "digital", "networking", "alianzas"].forEach(function (k) {
    var c = NODOS[k].col;
    velos[k] = el("rect", { class: "velo", x: c[0], y: c[1], width: c[2] - c[0], height: c[3] - c[1] }); capa.appendChild(velos[k]);
  });
  Object.keys(SUB).forEach(function (k) {
    var c = SUB[k].col;
    velosSub[k] = el("rect", { class: "velo", x: c[0], y: c[1], width: c[2] - c[0], height: c[3] - c[1] }); capa.appendChild(velosSub[k]);
  });
  /* Zonas sensibles: categorías y subcategorías de Networking */
  ["print", "digital", "networking", "alianzas"].forEach(function (k) {
    var c = NODOS[k].col, z = el("rect", { class: "zona", x: c[0], y: c[1], width: c[2] - c[0], height: c[3] - c[1] });
    z.addEventListener("mouseenter", function () { if (actual === "todo") sombrear(k, true); });
    z.addEventListener("mouseleave", function () { if (actual === "todo") sombrear(null, true); });
    z.addEventListener("click", function () { if (actual !== k) ir(k); });
    capa.appendChild(z);
  });
  Object.keys(SUB).forEach(function (k) {
    var c = SUB[k].col, z = el("rect", { class: "zona", x: c[0], y: c[1], width: c[2] - c[0], height: c[3] - c[1] });
    z.addEventListener("click", function (e) { e.stopPropagation(); ir("networking", k); });
    capa.appendChild(z);
  });

  function sombrear(k, suave) {
    Object.keys(velos).forEach(function (o) {
      velos[o].classList.toggle("on", !!k && o !== k && !suave);
      velos[o].classList.toggle("suave", !!k && o !== k && suave);
    });
  }
  function sombrearSub(k) {
    Object.keys(velosSub).forEach(function (o) { velosSub[o].classList.toggle("on", !!k && o !== k); });
  }
  function encajar(r) {   /* ajusta la zona al tamaño de la pantalla, con margen */
    var w = r[2] - r[0], h = r[3] - r[1], m = 0.08, box = svg.getBoundingClientRect(), a = box.width / Math.max(box.height, 1);
    w *= 1 + m * 2; h *= 1 + m * 2;
    if (w / h < a) w = h * a; else h = w / a;
    var cx = (r[0] + r[2]) / 2, cy = (r[1] + r[3]) / 2;
    return [cx - w / 2, cy - h / 2, w, h];
  }
  function animar(dest) {
    var desde = vb.slice(), t0 = performance.now(), dur = 900;
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) dur = 1;
    cancelAnimationFrame(anim);
    (function paso(t) {
      var p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      vb = desde.map(function (v, i) { return v + (dest[i] - v) * e; });
      svg.setAttribute("viewBox", vb.join(" "));
      if (p < 1) anim = requestAnimationFrame(paso);
    })(t0);
  }
  function ir(k, s) {
    actual = k; sub = s || null;
    var r = s ? SUB[s].r : NODOS[k].r;
    animar(k === "todo" ? [0, 0, 1920, 1080] : encajar(r));
    sombrear(k === "todo" ? null : k, false);
    sombrearSub(s || null);
    botones.forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.k === k); });
    info.innerHTML = s ? "<em>Networking · " + SUB[s].n + "</em> · " + SUB[s].t : NODOS[k].t;
  }
  var botones = Object.keys(NODOS).map(function (k) {
    var b = document.createElement("button"); b.type = "button"; b.dataset.k = k; b.textContent = NODOS[k].n;
    b.addEventListener("click", function () { ir(k); }); filtros.appendChild(b); return b;
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") ir(actual === "networking" && sub ? "networking" : "todo"); });
  window.addEventListener("resize", function () { if (actual !== "todo") { vb = encajar(sub ? SUB[sub].r : NODOS[actual].r); svg.setAttribute("viewBox", vb.join(" ")); } });
  ir("todo");
})();
</script>
