<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ekos · Tipografías</title>
<!-- EKOS · Muestrario de ABC Areal y Sentient con mensajes de marca. Altura recomendada del iframe: 760 px -->
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=sentient@400&display=swap">
<style>
  /* ABC Areal: coloca los archivos en la carpeta fonts/ con estos nombres */
  @font-face { font-family: "Areal"; src: url("fonts/Areal-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Areal"; src: url("fonts/Areal-Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }
  :root { --ui: #F2F2F2; --ink: #000000; --muted: #787878; --line: #C4C4C4;
          --sans: "Areal", "ABC Areal", "Helvetica Neue", Helvetica, Arial, sans-serif;
          --serif: "Sentient", Georgia, "Times New Roman", serif;
          --ease: cubic-bezier(.2,.7,.2,1); }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--ui); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  body { display: flex; flex-direction: column; min-height: 420px; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  /* ---------- Escena ---------- */
  .escena { --bg: #FFE473; --fg: #CEA232; position: relative; flex: 1; overflow: hidden;
            background: var(--bg); color: var(--fg); transition: background-color .9s var(--ease), color .9s var(--ease); }
  .texto { position: absolute; inset: 0; padding: 5% 4.5%; display: flex; flex-direction: column; justify-content: center;
           font-family: var(--f); transition: opacity .45s var(--ease), transform .6s var(--ease); }
  .texto.sale { opacity: 0; transform: translateY(14px); }
  body[data-fuente="serif"] .escena { --f: var(--serif); }
  body[data-fuente="sans"]  .escena { --f: var(--sans); }
  .glifos p { font-size: clamp(54px, 10.5vw, 200px); line-height: 1.08; white-space: nowrap; letter-spacing: -.005em; }
  .frase p  { font-size: clamp(46px, 8.6vw, 160px); line-height: 1.02; letter-spacing: -.01em; max-width: 14ch; }

  /* ---------- Barra ---------- */
  .barra { display: grid; grid-template-columns: auto auto 1fr auto; align-items: center; gap: 28px; padding: 18px 28px; font-size: 14px; }
  .barra b { font-weight: 700; }
  .fuentes { display: flex; gap: 22px; }
  .fuentes button { padding: 3px 0; color: var(--muted); border-bottom: 1px solid transparent; transition: color .3s, border-color .3s; }
  .fuentes button:hover { color: var(--ink); }
  .fuentes button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  .info { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info em { font-style: normal; color: var(--ink); margin-left: 10px; }
  .flechas { display: flex; align-items: center; gap: 4px; }
  .flechas button { padding: 4px 8px; font-size: 18px; color: var(--muted); transition: color .3s; }
  .flechas button:hover { color: var(--ink); }
  .flechas .pausa { font-size: 13px; margin-right: 8px; }

  @media (max-width: 760px) {
    .barra { grid-template-columns: 1fr auto; gap: 10px 18px; padding: 14px 16px; }
    .barra > b { display: none; }
    .info { grid-column: 1 / -1; order: 3; }
  }
  @media (prefers-reduced-motion: reduce) { .escena, .texto { transition: none; } }
</style>
</head>
<body data-fuente="serif">
<div class="escena" id="escena" aria-live="polite"><div class="texto" id="texto"></div></div>
<div class="barra">
  <b>Tipografías</b>
  <div class="fuentes" role="group" aria-label="Tipografía">
    <button type="button" data-f="serif" aria-pressed="true">Sentient</button>
    <button type="button" data-f="sans" aria-pressed="false">ABC Areal</button>
  </div>
  <p class="info" id="info"></p>
  <div class="flechas">
    <button type="button" class="pausa" id="pausa" aria-label="Pausar">Pausar</button>
    <button type="button" id="prev" aria-label="Anterior">←</button>
    <button type="button" id="next" aria-label="Siguiente">→</button>
  </div>
</div>
<script>
(function () {
  /* Mensajes de marca y headlines del documento "Textos manual de marca Ekos" */
  var FRASES = [
    ["Sostenibilidad", "Te ayudamos a tomar decisiones sostenibles."],
    ["Experiencia", "Conocemos tus negocios, Ecuador."],
    ["Influencia", "Aquí se decide el hoy y el mañana del Ecuador."],
    ["Inteligencia", "Toma decisiones más informadas."],
    ["Sostenibilidad", "Nuestro negocio es que perdures en el tiempo."],
    ["Experiencia", "Un legado no se compra, se gana."],
    ["Influencia", "Comenzamos las conversaciones que cambian el país."],
    ["Inteligencia", "Déjanos el riesgo. Quédate con lo aprendido."],
    ["Headline", "En confianza"],
    ["Tono optimista", "Las buenas prácticas suman."]
  ];
  /* Cada tipografía abre con sus glifos en su color; las frases recorren la paleta de submarcas */
  var BASE = { serif: ["#FFE473", "#CEA232"], sans: ["#9CD8E8", "#2F4B66"] };
  var PALETA = [["#F2C8BB", "#C4816C"], ["#A7ED56", "#4D6B2F"], ["#F871FF", "#A010A0"], ["#333333", "#C4C4C4"],
                ["#E2BB64", "#8E6916"], ["#64CAED", "#2F4B66"], ["#FF5267", "#B71125"], ["#000000", "#F2F2F2"],
                ["#91C963", "#4D6B2F"], ["#C4C4C4", "#333333"]];
  var GLIFOS = ["ABCDEFGHIJKLMNOPQRSTUVWXYZ", "abcdefghijklmnopqrstuvwxyz", "0123456789", "!@#$%^&*()?+"];
  var NOMBRE = { serif: "Sentient", sans: "ABC Areal" };

  var esc = document.getElementById("escena"), txt = document.getElementById("texto"),
      info = document.getElementById("info"), btnP = document.getElementById("pausa");
  var fuente = "serif", i = 0, total = FRASES.length + 1, timer = null, pausado = false, hover = false;

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function pintar() {
    var c;
    if (i === 0) {
      txt.className = "texto glifos";
      txt.innerHTML = GLIFOS.map(function (g) { return "<p>" + g + "</p>"; }).join("");
      c = BASE[fuente];
      info.innerHTML = pad(1) + " / " + pad(total) + "<em>Glifos · " + NOMBRE[fuente] + "</em>";
    } else {
      var f = FRASES[i - 1];
      txt.className = "texto frase";
      txt.innerHTML = "<p>" + f[1] + "</p>";
      c = PALETA[(i - 1 + (fuente === "sans" ? 5 : 0)) % PALETA.length];
      info.innerHTML = pad(i + 1) + " / " + pad(total) + "<em>" + f[0] + " · " + NOMBRE[fuente] + "</em>";
    }
    esc.style.setProperty("--bg", c[0]); esc.style.setProperty("--fg", c[1]);
  }
  function go(k) {
    i = (k + total) % total;
    txt.classList.add("sale");
    setTimeout(function () { pintar(); requestAnimationFrame(function () { txt.classList.remove("sale"); }); }, 380);
    programar();
  }
  function programar() {
    clearTimeout(timer);
    if (!pausado && !hover) timer = setTimeout(function () { go(i + 1); }, 4200);
  }
  document.querySelectorAll(".fuentes button").forEach(function (b) {
    b.addEventListener("click", function () {
      fuente = b.dataset.f; document.body.dataset.fuente = fuente;
      document.querySelectorAll(".fuentes button").forEach(function (o) { o.setAttribute("aria-pressed", o === b); });
      go(0);
    });
  });
  document.getElementById("prev").addEventListener("click", function () { go(i - 1); });
  document.getElementById("next").addEventListener("click", function () { go(i + 1); });
  btnP.addEventListener("click", function () {
    pausado = !pausado; btnP.textContent = pausado ? "Reproducir" : "Pausar";
    btnP.setAttribute("aria-label", btnP.textContent); programar();
  });
  /* Al pasar el mouse sobre la muestra se detiene para leerla con calma */
  esc.addEventListener("mouseenter", function () { hover = true; clearTimeout(timer); });
  esc.addEventListener("mouseleave", function () { hover = false; programar(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(i + 1);
    if (e.key === "ArrowLeft") go(i - 1);
  });
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { pausado = true; btnP.textContent = "Reproducir"; }
  pintar(); programar();
})();
</script>
</body>
</html>
