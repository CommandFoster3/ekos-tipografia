  @font-face { font-family: "Areal"; src: url("fonts/Areal-Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }
  :root { --ease: cubic-bezier(.2,.7,.2,1); --sans: "Areal", "ABC Areal", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: #FFFFFF; font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  body { padding: 28px; }
  .grilla { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; max-width: 1400px; margin: 0 auto; }
  .tile { position: relative; aspect-ratio: 16 / 9; background: var(--bg); color: var(--fg); overflow: hidden; outline: none; cursor: default; }
  .tile svg { position: absolute; left: 50%; top: 50%; width: 35%; transform: translate(-50%, -50%);
               fill: currentColor; transition: transform .8s var(--ease); }
  .tile:hover svg, .tile:focus-visible svg, .tile.on svg { transform: translate(-50%, -50%) scale(1.05); }
  .tile figcaption { position: absolute; left: 22px; right: 22px; bottom: 18px; display: flex; flex-wrap: wrap; gap: 4px 18px;
                      font-size: 13px; color: var(--fg); opacity: 0; transform: translateY(6px);
                      transition: opacity .45s var(--ease), transform .45s var(--ease); }
  .tile:hover figcaption, .tile:focus-visible figcaption, .tile.on figcaption { opacity: 1; transform: none; }
  .tile figcaption b { font-weight: 700; }
  .tile figcaption i { display: inline-block; width: 9px; height: 9px; margin-right: 6px; background: var(--bg); box-shadow: inset 0 0 0 1px var(--fg); }
  .tile figcaption i.l { background: var(--fg); }
  .tile:focus-visible { outline: 2px solid #000; outline-offset: 3px; }
  @media (max-width: 700px) { body { padding: 16px; } .grilla { grid-template-columns: 1fr; gap: 16px; } .tile svg { width: 42%; } }
  @media (prefers-reduced-motion: reduce) { .tile svg, .tile figcaption { transition: none; } }
</style>
